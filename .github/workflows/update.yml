name: Auto Update CF IPs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      # 这里改成安装 playwright 并下载浏览器内核
      run: |
        pip install playwright
        playwright install chromium

    - name: Run scripts
      # 三个脚本各跑一遍，分别生成三个文件：
      # main.py（全量）-> public/all.txt，yd.py（移动）-> public/ip.txt，dx.py（电信+多线）-> public/dx.txt
      # 一个脚本失败不影响另外两个继续跑
      run: |
        python main.py || true
        python yd.py || true
        python dx.py || true

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/all.txt public/ip.txt public/dx.txt
        git commit -m "Update ip lists" || exit 0
        git push

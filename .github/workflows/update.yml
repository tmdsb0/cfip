name: Auto Update CF IPs

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      # 这里改成安装 playwright 并下载浏览器内核
      run: |
        pip install playwright
        playwright install chromium

    - name: Run script
      # 一个脚本一次抓取，分写三个文件：
      # main.py -> public/all.txt（全量）、public/ip.txt（移动）、public/dx.txt（电信+多线）
      # 注意这里不再加 `|| true`：脚本失败时直接让任务变红、不提交，
      # 这样三个文件要么一起更新、要么一个都不更新，不会再出现不同步。
      # 以前三个脚本各加 `|| true`，main.py 失败会被藏起来、任务还显示 Success。
      run: |
        python main.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/all.txt public/ip.txt public/dx.txt
        git commit -m "Update ip lists" || exit 0
        git push
